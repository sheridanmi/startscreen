        window.switchRandomizerTab = function(id, tab) {
            const pickerTab = document.getElementById(`randomizer-picker-${id}`);
            const groupsTab = document.getElementById(`randomizer-groups-${id}`);
            const widget = document.getElementById(`widget-${id}`);
            const tabs = widget.querySelectorAll('.randomizer-tab');
            
            tabs.forEach(t => t.classList.remove('active'));
            
            if (tab === 'picker') {
                pickerTab.classList.remove('hidden');
                groupsTab.classList.add('hidden');
                tabs[0].classList.add('active');
            } else {
                pickerTab.classList.add('hidden');
                groupsTab.classList.remove('hidden');
                tabs[1].classList.add('active');
            }
        }

        window.adjustGroupCount = function(id, delta) {
            const display = document.getElementById(`group-count-${id}`);
            let count = parseInt(display.textContent) + delta;
            count = Math.max(2, Math.min(10, count)); // Between 2 and 10 groups
            display.textContent = count;
        }

        window.makeGroups = function(id) {
            const input = document.getElementById(`name-input-${id}`);
            const resultContainer = document.getElementById(`groups-result-${id}`);
            const groupCount = parseInt(document.getElementById(`group-count-${id}`).textContent);
            
            const names = input.value.split('\n').filter(n => n.trim());
            
            if (names.length === 0) {
                resultContainer.innerHTML = '<p style="text-align:center; color: var(--text-muted);">Add names in the Name Picker tab first!</p>';
                return;
            }
            
            if (names.length < groupCount) {
                resultContainer.innerHTML = `<p style="text-align:center; color: var(--text-muted);">Not enough names for ${groupCount} groups. You have ${names.length} names.</p>`;
                return;
            }
            
            // Shuffle names
            const shuffled = [...names].sort(() => Math.random() - 0.5);
            
            // Create groups
            const groups = Array.from({ length: groupCount }, () => []);
            
            shuffled.forEach((name, index) => {
                groups[index % groupCount].push(name.trim());
            });
            
            // Animate and display
            resultContainer.innerHTML = '<p style="text-align:center; color: var(--text-muted);">Shuffling...</p>';
            
            setTimeout(() => {
                let html = '';
                groups.forEach((group, index) => {
                    html += `
                        <div class="group-card">
                            <div class="group-card-header">Group ${index + 1}</div>
                            <div class="group-card-members">
                                ${group.map(name => `<span class="group-member">${name}</span>`).join('')}
                            </div>
                        </div>
                    `;
                });
                resultContainer.innerHTML = html;
            }, 500);
        }

        window.pickName = function(id) {
            const input = document.getElementById(`name-input-${id}`);
            const display = document.getElementById(`name-display-${id}`);
            const names = input.value.split('\n').filter(n => n.trim());
            
            if (names.length === 0) {
                display.textContent = 'Add some names first!';
                return;
            }
            
            display.classList.add('picking');
            
            let picks = 0;
            const pickInterval = setInterval(() => {
                display.textContent = names[Math.floor(Math.random() * names.length)];
                picks++;
                if (picks > 15) {
                    clearInterval(pickInterval);
                    display.classList.remove('picking');
                    display.textContent = names[Math.floor(Math.random() * names.length)];
                }
            }, 80);
        }

        window.startPoll = function(id) {
            const widget = state.widgets.find(w => w.id === id);
            if (!widget) return;
            
            // Get settings
            const question = document.getElementById(`poll-question-${id}`).value.trim();
            const hideResults = document.getElementById(`poll-hide-results-${id}`).checked;
            const answerCount = widget.data.answerCount || 3;
            const pollType = widget.data.pollType || 'abc';
            const chartType = widget.data.chartType || 'bar';
            
            widget.data.question = question;
            widget.data.hideResults = hideResults;
            widget.data.answerCount = answerCount;
            widget.data.chartType = chartType;
            widget.data.votes = {};
            widget.data.pollStarted = true;
            
            // Hide setup, show poll
            document.getElementById(`poll-tab-type-${id}`).classList.add('hidden');
            document.getElementById(`poll-tab-settings-${id}`).classList.add('hidden');
            document.querySelector(`#poll-container-${id} .poll-tabs`).classList.add('hidden');
            document.getElementById(`poll-start-btn-${id}`).classList.add('hidden');
            document.getElementById(`poll-display-${id}`).classList.remove('hidden');
            document.getElementById(`poll-back-btn-${id}`).classList.remove('hidden');
            
            // Set question
            document.getElementById(`poll-question-display-${id}`).textContent = question;
            
            // Generate options
            const optionsContainer = document.getElementById(`poll-options-${id}`);
            let optionsHTML = '';
            let options = [];
            
            if (pollType === 'abc') {
                const letters = ['A', 'B', 'C', 'D', 'E'];
                const colors = ['#4ecdc4', '#a8e6cf', '#ffd93d', '#fab1a0', '#ff6b6b'];
                for (let i = 0; i < answerCount; i++) {
                    options.push({ key: letters[i], display: letters[i], color: colors[i] });
                }
            } else if (pollType === 'smiley') {
                const smileys5 = [
                    { key: 'great', display: '😊', color: '#4ecdc4' },
                    { key: 'good', display: '🙂', color: '#a8e6cf' },
                    { key: 'neutral', display: '😐', color: '#ffd93d' },
                    { key: 'bad', display: '🙁', color: '#fab1a0' },
                    { key: 'awful', display: '😟', color: '#ff6b6b' }
                ];
                const smileys3 = [smileys5[0], smileys5[2], smileys5[4]];
                const smileys2 = [smileys5[0], smileys5[4]];
                const smileys4 = [smileys5[0], smileys5[1], smileys5[2], smileys5[4]];
                
                if (answerCount === 2) options = smileys2;
                else if (answerCount === 3) options = smileys3;
                else if (answerCount === 4) options = smileys4;
                else options = smileys5;
            } else if (pollType === 'truefalse') {
                options = [
                    { key: 'true', display: '✓', color: '#4ecdc4' },
                    { key: 'false', display: '✗', color: '#ff6b6b' }
                ];
            }
            
            widget.data.options = options;
            
            options.forEach(opt => {
                widget.data.votes[opt.key] = 0;
                optionsHTML += `
                    <div class="poll-option" onclick="votePoll(${id}, '${opt.key}')">
                        <div class="poll-option-circle" style="background: ${opt.color}" data-key="${opt.key}">
                            ${opt.display}
                            <span class="poll-option-count" style="border-color: ${opt.color}; ${hideResults ? 'display:none' : ''}">0</span>
                        </div>
                    </div>
                `;
            });
            
            optionsContainer.innerHTML = optionsHTML;
            renderPollChart(id);
        }

        window.votePoll = function(id, optionKey) {
            const widget = state.widgets.find(w => w.id === id);
            if (!widget) return;
            
            widget.data.votes[optionKey]++;
            
            // Update count badge
            if (!widget.data.hideResults) {
                const circle = document.querySelector(`#poll-options-${id} .poll-option-circle[data-key="${optionKey}"]`);
                if (circle) {
                    const count = circle.querySelector('.poll-option-count');
                    if (count) count.textContent = widget.data.votes[optionKey];
                }
            }
            
            // Animate
            const clickedOpt = event.currentTarget;
            clickedOpt.style.transform = 'scale(1.2)';
            setTimeout(() => { clickedOpt.style.transform = ''; }, 150);
            
            // Update chart
            renderPollChart(id);
        }

        function renderPollChart(id) {
            const widget = state.widgets.find(w => w.id === id);
            if (!widget || !widget.data.options) return;
            
            const chartContainer = document.getElementById(`poll-chart-${id}`);
            const chartType = widget.data.chartType || 'bar';
            const hideResults = widget.data.hideResults;
            
            if (hideResults || chartType === 'none') {
                chartContainer.innerHTML = '';
                return;
            }
            
            const totalVotes = Object.values(widget.data.votes).reduce((a, b) => a + b, 0);
            
            if (chartType === 'bar') {
                let html = '';
                widget.data.options.forEach(opt => {
                    const count = widget.data.votes[opt.key] || 0;
                    const percent = totalVotes > 0 ? (count / totalVotes * 100) : 0;
                    html += `
                        <div class="poll-bar-row">
                            <div class="poll-bar-label">${opt.display}</div>
                            <div class="poll-bar-container">
                                <div class="poll-bar-fill" style="background: ${opt.color}; width: ${Math.max(percent, count > 0 ? 15 : 0)}%">
                                    ${count > 0 ? count : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });
                chartContainer.innerHTML = html;
            } else if (chartType === 'pie') {
                // Simple pie using conic-gradient
                let gradientStops = [];
                let currentAngle = 0;
                
                widget.data.options.forEach(opt => {
                    const count = widget.data.votes[opt.key] || 0;
                    const percent = totalVotes > 0 ? (count / totalVotes * 100) : 0;
                    const nextAngle = currentAngle + (percent * 3.6);
                    gradientStops.push(`${opt.color} ${currentAngle}deg ${nextAngle}deg`);
                    currentAngle = nextAngle;
                });
                
                if (totalVotes === 0) {
                    gradientStops = ['rgba(255,255,255,0.1) 0deg 360deg'];
                }
                
                chartContainer.innerHTML = `
                    <div style="width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(${gradientStops.join(', ')}); margin: 0 auto;"></div>
                    <div style="text-align: center; margin-top: 8px; color: var(--text-muted); font-size: 12px;">${totalVotes} vote${totalVotes !== 1 ? 's' : ''}</div>
                `;
            }
        }

        window.saveCurrentLayout = function() {
            const layoutName = document.getElementById('new-layout-name').value.trim();
            if (!layoutName) {
                alert('Please enter a layout name');
                return;
            }
            
            // Capture current state
            const bgLayer = document.getElementById('background-layer');
            const layout = {
                name: layoutName,
                savedAt: new Date().toISOString(),
                background: bgLayer.className || 'default',
                customBackgroundImage: state.customBackgroundImage || null,
                widgets: []
            };
            
            // Capture each widget's state
            state.widgets.forEach(w => {
                const rect = w.element.getBoundingClientRect();
                const widgetData = {
                    type: w.type,
                    x: parseInt(w.element.style.left) || rect.left,
                    y: parseInt(w.element.style.top) || rect.top,
                    width: parseInt(w.element.style.width) || rect.width,
                    height: w.element.style.height !== 'auto' ? parseInt(w.element.style.height) : null
                };
                
                // Save widget-specific data
                if (w.type === 'randomizer') {
                    const input = document.getElementById(`name-input-${w.id}`);
                    if (input) widgetData.names = input.value;
                }
                if (w.type === 'text') {
                    const textarea = w.element.querySelector('.text-display');
                    if (textarea) widgetData.text = textarea.value;
                }
                if (w.type === 'timer') {
                    const minInput = document.getElementById(`timer-min-${w.id}`);
                    const secInput = document.getElementById(`timer-sec-${w.id}`);
                    if (minInput && secInput) {
                        widgetData.timerMin = minInput.value;
                        widgetData.timerSec = secInput.value;
                    }
                }
                if (w.type === 'qr') {
                    const input = document.getElementById(`qr-input-${w.id}`);
                    if (input) widgetData.qrUrl = input.value;
                }
                if (w.type === 'poll') {
                    widgetData.pollType = w.data.pollType;
                    widgetData.question = w.data.question;
                    widgetData.answerCount = w.data.answerCount;
                    widgetData.chartType = w.data.chartType;
                }
                
                layout.widgets.push(widgetData);
            });
            
            // Save to localStorage
            const layouts = JSON.parse(localStorage.getItem('teacherDashboardLayouts') || '{}');
            layouts[layoutName] = layout;
            localStorage.setItem('teacherDashboardLayouts', JSON.stringify(layouts));
            
            document.getElementById('new-layout-name').value = '';
            renderSavedLayouts();

            const originalText = btn.textContent;
            btn.textContent = '✓ Saved!';

                btn.textContent = originalText;
                btn.style.background = '';
            }, 1500);
        }

        window.loadLayout = function(layoutName) {
            const layouts = JSON.parse(localStorage.getItem('teacherDashboardLayouts') || '{}');
            const layout = layouts[layoutName];
            
            if (!layout) return;
            
            // Clear existing widgets
            state.widgets.forEach(w => {
                if (w.data.interval) clearInterval(w.data.interval);
                w.element.remove();
            });
            state.widgets = [];
            state.widgetIdCounter = 0;
            
            // Clear drawing canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Set background
            const bgLayer = document.getElementById('background-layer');
            bgLayer.className = layout.background === 'default' ? '' : layout.background;
            
            // Handle custom background image
            if (layout.customBackgroundImage) {
                bgLayer.style.backgroundImage = `url(${layout.customBackgroundImage})`;
                bgLayer.style.backgroundSize = 'cover';
                bgLayer.style.backgroundPosition = 'center';
                state.customBackgroundImage = layout.customBackgroundImage;
                document.getElementById('clear-bg-btn').style.display = 'flex';
                document.querySelectorAll('.bg-option').forEach(b => b.classList.remove('active', 'custom-active'));
                document.querySelector('.bg-option.upload').classList.add('custom-active');
            } else {
                bgLayer.style.backgroundImage = '';
                state.customBackgroundImage = null;
                document.getElementById('clear-bg-btn').style.display = 'none';
                
                // Update background picker selection
                document.querySelectorAll('.bg-option').forEach(btn => {
                    btn.classList.remove('active', 'custom-active');
                    if (btn.dataset.bg === (layout.background || 'default')) {
                        btn.classList.add('active');
                    }
                });
            }
            
            // Recreate widgets
            layout.widgets.forEach(wData => {
                const widget = createWidget(wData.type, wData.x, wData.y);
                
                // Restore size
                if (wData.width) widget.style.width = `${wData.width}px`;
                if (wData.height) widget.style.height = `${wData.height}px`;
                
                // Restore widget-specific data
                const widgetState = state.widgets[state.widgets.length - 1];
                
                if (wData.type === 'randomizer' && wData.names) {
                    const input = document.getElementById(`name-input-${widgetState.id}`);
                    if (input) input.value = wData.names;
                }
                if (wData.type === 'text' && wData.text) {
                    const textarea = widget.querySelector('.text-display');
                    if (textarea) textarea.value = wData.text;
                }
                if (wData.type === 'timer') {
                    const minInput = document.getElementById(`timer-min-${widgetState.id}`);
                    const secInput = document.getElementById(`timer-sec-${widgetState.id}`);
                    if (minInput && wData.timerMin) minInput.value = wData.timerMin;
                    if (secInput && wData.timerSec) secInput.value = wData.timerSec;
                }
                if (wData.type === 'qr' && wData.qrUrl) {
                    const input = document.getElementById(`qr-input-${widgetState.id}`);
                    if (input) {
                        input.value = wData.qrUrl;
                        generateQR(widgetState.id);
                    }
                }
                if (wData.type === 'poll') {
                    if (wData.pollType) {
                        widgetState.data.pollType = wData.pollType;
                        const btn = document.querySelector(`#poll-type-selector-${widgetState.id} .poll-type-btn[data-type="${wData.pollType}"]`);
                        if (btn) selectPollTypeOption(widgetState.id, wData.pollType, btn);
                    }
                    if (wData.question) {
                        const qInput = document.getElementById(`poll-question-${widgetState.id}`);
                        if (qInput) qInput.value = wData.question;
                    }
                    if (wData.answerCount) widgetState.data.answerCount = wData.answerCount;
                    if (wData.chartType) widgetState.data.chartType = wData.chartType;
                }
            });
            
            closeLayoutManager();
        }

        function renderSavedLayouts() {
            const container = document.getElementById('saved-layouts-list');
            const layouts = JSON.parse(localStorage.getItem('teacherDashboardLayouts') || '{}');
            
            if (Object.keys(layouts).length === 0) {
                container.innerHTML = `
                    <div class="no-layouts-message">
                        <div class="icon">📋</div>
                        <p>No saved layouts yet</p>
                        <p style="font-size: 13px;">Set up your widgets, then save a layout to use it again tomorrow!</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            for (const [name, layout] of Object.entries(layouts)) {
                const date = new Date(layout.savedAt);
                const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                const widgetCount = layout.widgets.length;
                
                // Get widget type summary
                const typeCounts = {};
                layout.widgets.forEach(w => {
                    typeCounts[w.type] = (typeCounts[w.type] || 0) + 1;
                });
                
                const widgetTags = Object.entries(typeCounts).map(([type, count]) => 
                    `<span class="layout-widget-tag">${type}${count > 1 ? ` ×${count}` : ''}</span>`
                ).join('');
                
                html += `
                    <div class="saved-layout-item">
                        <div class="saved-layout-info">
                            <span class="saved-layout-name">${name}</span>
                            <div class="saved-layout-meta">
                                <span>📅 ${dateStr}</span>
                                <span>🧩 ${widgetCount} widget${widgetCount !== 1 ? 's' : ''}</span>
                            </div>
                            <div class="layout-widget-preview">${widgetTags}</div>
                        </div>
                        <div class="saved-layout-actions">
                            <button class="btn-load-layout" onclick="loadLayout('${name}')">Load</button>
                            <button class="btn-delete-layout" onclick="deleteLayout('${name}')">🗑️</button>
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }

        // ============== DRAG & RESIZE ==============
        function makeDraggable(widget) {
            const header = widget.querySelector('.widget-header');
            
            header.addEventListener('mousedown', (e) => {
                if (state.drawing.active) return;
                state.activeWidget = widget;
                const rect = widget.getBoundingClientRect();
                state.dragOffset = {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
                widget.style.zIndex = 1000;
            });
        }

        function makeResizable(widget) {
            const handle = widget.querySelector('.resize-handle');
            
            handle.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                state.resizing = true;
                state.activeWidget = widget;
                widget.style.zIndex = 1000;
            });

            // Add ResizeObserver to scale contents (debounced to prevent loop errors)
            let resizeTimeout;
            const resizeObserver = new ResizeObserver(entries => {
                // Clear any pending timeout
                if (resizeTimeout) cancelAnimationFrame(resizeTimeout);
                
                // Use requestAnimationFrame to debounce
                resizeTimeout = requestAnimationFrame(() => {
                    for (let entry of entries) {
                        const width = entry.contentRect.width;
                        const height = entry.contentRect.height;
                        scaleWidgetContent(widget, width, height);
                    }
                });
            });
            resizeObserver.observe(widget);
        }

        function scaleWidgetContent(widget, width, height) {
            const contentHeight = height - 60; // Account for header
            
            // Scale clock
            const clockDisplay = widget.querySelector('.clock-display');
            if (clockDisplay) {
                const scale = Math.min(width / 280, contentHeight / 100, 2.5);
                clockDisplay.style.fontSize = `${48 * scale}px`;
                const dateEl = widget.querySelector('.clock-date');
                if (dateEl) dateEl.style.fontSize = `${14 * scale}px`;
            }

            // Scale timer display
            const timerDisplay = widget.querySelector('.timer-display');
            if (timerDisplay) {
                const scale = Math.min(width / 280, contentHeight / 180, 2.5);
                timerDisplay.style.fontSize = `${56 * scale}px`;
            }

            // Scale timer inputs
            const timerInputContainer = widget.querySelector('.timer-input-container');
            if (timerInputContainer) {
                const scale = Math.min(width / 280, contentHeight / 180, 2.5);
                const inputs = timerInputContainer.querySelectorAll('.timer-input');
                inputs.forEach(input => {
                    input.style.fontSize = `${48 * scale}px`;
                    input.style.width = `${70 * scale}px`;
                    input.style.padding = `${8 * scale}px ${4 * scale}px`;
                });
                const colon = timerInputContainer.querySelector('.timer-colon');
                if (colon) colon.style.fontSize = `${48 * scale}px`;
            }

            // Scale timer controls and presets
            const timerControls = widget.querySelector('.timer-controls');
            if (timerControls) {
                const scale = Math.min(width / 280, contentHeight / 180, 2);
                timerControls.style.gap = `${10 * scale}px`;
                timerControls.style.marginTop = `${16 * scale}px`;
                timerControls.querySelectorAll('.timer-btn').forEach(btn => {
                    btn.style.padding = `${10 * scale}px ${20 * scale}px`;
                    btn.style.fontSize = `${14 * scale}px`;
                });
            }

            // Scale stopwatch
            const stopwatchDisplay = widget.querySelector('.stopwatch-display');
            if (stopwatchDisplay) {
                const scale = Math.min(width / 260, contentHeight / 140, 2.5);
                stopwatchDisplay.style.fontSize = `${42 * scale}px`;
                const ms = stopwatchDisplay.querySelector('.stopwatch-ms');
                if (ms) ms.style.fontSize = `${24 * scale}px`;
            }

            // Scale dice
            const diceContainer = widget.querySelector('.dice-container');
            if (diceContainer) {
                const scale = Math.min(width / 220, contentHeight / 180, 2.5);
                const dice = widget.querySelectorAll('.dice');
                dice.forEach(d => {
                    d.style.width = `${70 * scale}px`;
                    d.style.height = `${70 * scale}px`;
                    d.style.fontSize = `${36 * scale}px`;
                    d.style.borderRadius = `${14 * scale}px`;
                });
                const rollBtn = widget.querySelector('.roll-btn');
                if (rollBtn) {
                    rollBtn.style.padding = `${12 * scale}px ${32 * scale}px`;
                    rollBtn.style.fontSize = `${16 * scale}px`;
                }
                diceContainer.style.gap = `${16 * scale}px`;
            }

            // Scale traffic light
            const trafficLight = widget.querySelector('.traffic-light');
            if (trafficLight) {
                const scale = Math.min(width / 140, contentHeight / 260, 2.5);
                const bulbs = trafficLight.querySelectorAll('.traffic-light-bulb');
                bulbs.forEach(b => {
                    b.style.width = `${60 * scale}px`;
                    b.style.height = `${60 * scale}px`;
                });
                trafficLight.style.gap = `${12 * scale}px`;
                trafficLight.style.padding = `${20 * scale}px`;
                trafficLight.style.borderRadius = `${30 * scale}px`;
            }

            // Scale name picker
            const namePickerContent = widget.querySelector('.name-picker-content');
            if (namePickerContent) {
                const scale = Math.min(width / 280, contentHeight / 220, 2);
                const nameDisplay = widget.querySelector('.name-display');
                if (nameDisplay) {
                    nameDisplay.style.fontSize = `${24 * scale}px`;
                    nameDisplay.style.minHeight = `${60 * scale}px`;
                }
                const pickBtn = widget.querySelector('.pick-btn');
                if (pickBtn) {
                    pickBtn.style.padding = `${12 * scale}px ${24 * scale}px`;
                    pickBtn.style.fontSize = `${16 * scale}px`;
                }
            }

            // Scale text display
            const textDisplay = widget.querySelector('.text-display');
            if (textDisplay) {
                const scale = Math.min(width / 300, contentHeight / 140, 2);
                textDisplay.style.fontSize = `${24 * scale}px`;
            }

            // Scale QR code
            const qrContent = widget.querySelector('.qr-content');
            if (qrContent) {
                const scale = Math.min((width - 40) / 160, (contentHeight - 60) / 160, 2.5);
                const qrImg = widget.querySelector('.qr-display img');
                if (qrImg) {
                    const size = Math.floor(120 * scale);
                    qrImg.style.width = `${size}px`;
                    qrImg.style.height = `${size}px`;
                }
            }

            // Scale TI-84 calculator
            const ti84Container = widget.querySelector('.ti84-container');
            if (ti84Container) {
                ti84Container.style.minHeight = `${contentHeight - 20}px`;
                const iframe = ti84Container.querySelector('.ti84-iframe');
                if (iframe) {
                    iframe.style.minHeight = `${contentHeight - 20}px`;
                }
            }
        }

        document.addEventListener('mousemove', (e) => {
            if (state.activeWidget && !state.resizing) {
                state.activeWidget.style.left = `${e.clientX - state.dragOffset.x}px`;
                state.activeWidget.style.top = `${e.clientY - state.dragOffset.y}px`;
            } else if (state.resizing && state.activeWidget) {
                const rect = state.activeWidget.getBoundingClientRect();
                const newWidth = e.clientX - rect.left;
                const newHeight = e.clientY - rect.top;
                if (newWidth > 150) state.activeWidget.style.width = `${newWidth}px`;
                if (newHeight > 100) state.activeWidget.style.height = `${newHeight}px`;
            }
        });

        document.addEventListener('mouseup', () => {
            if (state.activeWidget) {
                state.activeWidget.style.zIndex = '';
            }
            state.activeWidget = null;
            state.resizing = false;
        });

        // ============== INITIAL WIDGETS ==============
        createWidget('clock', 50, 50);
        createWidget('timer', 400, 50);
    </script>
</body>
</html>
